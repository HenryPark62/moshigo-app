# Render 블루프린트: 저장소를 연결하면 이 설정대로 무료 웹 서비스를 만든다
services:
  - type: web
    name: moshigo
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      - key: MOSHIGO_ANALYSIS_PROVIDER
        value: foodguide
      - key: FOODGUIDE_API_URL
        sync: false
      - key: FOODGUIDE_API_KEY
        sync: false
      - key: FOODGUIDE_MAX_WAIT_SECONDS
        value: "600"
      - key: ANTHROPIC_API_KEY
        sync: false        # 웹 메뉴 검색에만 필요. 값은 Render 화면에서 직접 넣는다.
      - key: CLOVA_OCR_URL
        sync: false
      - key: CLOVA_OCR_SECRET
        sync: false
      - key: KAKAO_REST_KEY      # 한국 안 주변 식당 (선택)
        sync: false
      - key: GEOAPIFY_KEY        # 해외 주변 식당 (선택)
        sync: false
